<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دبرها – تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="common.js" defer></script>
    <style>
        .auth-card { max-width: 480px; margin: 60px auto; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><div class="nav-logo-name">دَبر<span>ها</span></div></a>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="hand-tools.html">معدات يدوية</a></li>
            <li><a href="heavy-vehicles.html">مركبات ثقيلة</a></li>
        </ul>
        <div class="nav-search"><i class="fas fa-search"></i><input type="text" placeholder="ابحث..."></div>
        <div class="nav-actions">
            <a href="add-listing.html" class="btn-add-listing">➕ أضف إعلان</a>
            <a href="login.html" class="btn-login" id="loginNavBtn">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="auth-card">
        <div class="auth-header" style="background: var(--black); padding: 20px; text-align: center; border-bottom: 2px solid var(--yellow);">
            <h2 style="color: white;">🔐 تسجيل الدخول</h2>
        </div>
        <div class="auth-body" style="padding: 32px; background: white; border-radius: 0 0 var(--r-xl) var(--r-xl);">
            <form id="loginForm">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" required placeholder="example@dabirha.com"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPassword" required placeholder="********"></div>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
            <div class="switch-link" style="text-align: center; margin-top: 24px;">
                لا تمتلك حساباً؟ <a href="register.html" style="color: var(--yellow);">انشئ حسابك الان</a>
            </div>
        </div>
    </div>

    <footer>... (footer) ...</footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const registeredUser = JSON.parse(localStorage.getItem('dabirha_user'));
            if (registeredUser && registeredUser.email === email && registeredUser.password === password) {
                localStorage.setItem('dabirha_user', JSON.stringify(registeredUser));
                alert('تم تسجيل الدخول بنجاح');
                window.location.href = 'index.html';
            } else {
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة');
            }
        });
    </script>
</body>
</html>
