<!-- register.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دبرها – إنشاء حساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="common.js" defer></script>
    <style>
        .auth-card { max-width: 580px; margin: 60px auto; }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; }
        .required-star { color: red; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><div class="nav-logo-name">دَبر<span>ها</span></div></a>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="hand-tools.html">معدات يدوية</a></li>
            <li><a href="heavy-vehicles.html">مركبات ثقيلة</a></li>
        </ul>
        <div class="nav-search"><i class="fas fa-search"></i><input type="text" placeholder="ابحث..."></div>
        <div class="nav-actions">
            <a href="add-listing.html" class="btn-add-listing">➕ أضف إعلان</a>
            <a href="login.html" class="btn-login" id="loginNavBtn">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="auth-card">
        <div class="auth-header" style="background: var(--black); padding: 20px; text-align: center; border-bottom: 2px solid var(--yellow);">
            <h2 style="color: white;">📝 إنشاء حساب جديد</h2>
        </div>
        <div class="auth-body" style="padding: 32px; background: white; border-radius: 0 0 var(--r-xl) var(--r-xl);">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group"><label>الاسم الأول <span class="required-star">*</span></label><input type="text" id="firstName" required placeholder="أحمد"></div>
                    <div class="form-group"><label>الاسم الأخير <span class="required-star">*</span></label><input type="text" id="lastName" required placeholder="العلي"></div>
                </div>
                <div class="form-group"><label>البريد الإلكتروني <span class="required-star">*</span></label><input type="email" id="email" required placeholder="example@dabirha.com"></div>
                <div class="form-group"><label>رقم الهاتف <span class="required-star">*</span></label><input type="tel" id="phone" required placeholder="0790000000"></div>
                <div class="form-group"><label>كلمة السر <span class="required-star">*</span></label><input type="password" id="password" required placeholder="********"></div>
                <div class="form-group"><label>تأكيد كلمة السر <span class="required-star">*</span></label><input type="password" id="confirmPassword" required placeholder="********"></div>
                <div class="form-group"><label>صورة عن الهوية <span class="required-star">*</span></label><input type="file" id="idImage" accept="image/*" required></div>
                <div class="form-group"><label>رقم المحفظة <span class="required-star">*</span></label><input type="text" id="walletNumber" required placeholder="9876543210"></div>
                <button type="submit" class="btn-primary">✅ إنشاء حساب</button>
            </form>
            <div class="switch-link" style="text-align: center; margin-top: 24px;">
                لديك حساب بالفعل؟ <a href="login.html" style="color: var(--yellow);">سجل الدخول هنا</a>
            </div>
        </div>
    </div>

    <footer>... (footer كامل) ...</footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                alert('كلمة السر وتأكيدها غير متطابقين');
                return;
            }
            const phone = document.getElementById('phone').value;
            if (!phone.match(/^07[0-9]{8}$/)) {
                alert('رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 10 أرقام');
                return;
            }
            const idFile = document.getElementById('idImage').files[0];
            if (!idFile) {
                alert('الرجاء رفع صورة الهوية');
                return;
            }
            const user = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: phone,
                walletNumber: document.getElementById('walletNumber').value,
                password: password,   // حفظ كلمة السر
                idImageName: idFile.name
            };
            localStorage.setItem('dabirha_user', JSON.stringify(user));
            alert('تم إنشاء حسابك بنجاح!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
