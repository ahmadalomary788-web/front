<!-- register.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دبرها – إنشاء حساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f5f5f5; }
        .auth-card { max-width: 580px; margin: 40px auto; padding: 0 20px 40px; }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; }
        .required-star { color: red; }
        .auth-logo { text-align: center; margin-bottom: 24px; font-size: 2rem; font-weight: 900; padding-top: 30px; }
        .auth-logo span { color: #F5C518; }
    </style>
</head>
<body>
    <div class="auth-logo">دَبر<span>ها</span></div>

    <div class="auth-card">
        <div class="auth-header" style="background: #0D0D0D; padding: 20px; text-align: center; border-bottom: 2px solid #F5C518; border-radius: 16px 16px 0 0;">
            <h2 style="color: white;">📝 إنشاء حساب جديد</h2>
        </div>
        <div class="auth-body" style="padding: 32px; background: white; border-radius: 0 0 16px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
            <div class="form-row">
                <div class="form-group"><label>الاسم الأول <span class="required-star">*</span></label><input type="text" id="firstName" required></div>
                <div class="form-group"><label>الاسم الأخير <span class="required-star">*</span></label><input type="text" id="lastName" required></div>
            </div>
            <div class="form-group"><label>البريد الإلكتروني <span class="required-star">*</span></label><input type="email" id="email" required placeholder="example@gmail.com"></div>
            <div class="form-group"><label>رقم الهاتف <span class="required-star">*</span></label><input type="tel" id="phone" required placeholder="0700000000"></div>
            <div class="form-group"><label>كلمة السر <span class="required-star">*</span></label><input type="password" id="password" required placeholder="********"></div>
            <div class="form-group"><label>تأكيد كلمة السر <span class="required-star">*</span></label><input type="password" id="confirmPassword" required placeholder="********"></div>
            <div class="form-group"><label>صورة عن الهوية <span class="required-star">*</span></label><input type="file" id="idImage" accept="image/*" required></div>
            <div class="form-group"><label>رقم المحفظة <span class="required-star">*</span></label><input type="text" id="walletNumber" required placeholder="9876543210"></div>
            <div id="registerError" style="color: red; margin-bottom: 12px; display: none;"></div>
            <button id="registerBtn" class="btn-primary">✅ إنشاء حساب</button>
            <div class="switch-link" style="text-align: center; margin-top: 24px;">
                لديك حساب بالفعل؟ <a href="login.html" style="color: #F5C518;">سجل الدخول هنا</a>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'index.html';

        document.getElementById('registerBtn').addEventListener('click', function() {
            const errDiv = document.getElementById('registerError');
            errDiv.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                errDiv.textContent = 'كلمة السر وتأكيدها غير متطابقين';
                errDiv.style.display = 'block';
                return;
            }
            const phone = document.getElementById('phone').value;
            if (!phone.match(/^07[0-9]{8}$/)) {
                errDiv.textContent = 'رقم الهاتف يجب أن يبدأ بـ 07 ويتكون من 10 أرقام';
                errDiv.style.display = 'block';
                return;
            }
            const idFile = document.getElementById('idImage').files[0];
            if (!idFile) {
                errDiv.textContent = 'الرجاء رفع صورة الهوية';
                errDiv.style.display = 'block';
                return;
            }

            const email = document.getElementById('email').value.trim();
            // التحقق من عدم تكرار الإيميل
            const users = JSON.parse(localStorage.getItem('dabirha_users')) || [];
            if (users.find(u => u.email === email)) {
                errDiv.textContent = 'هذا البريد الإلكتروني مسجل مسبقاً';
                errDiv.style.display = 'block';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(ev) {
                const user = {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: email,
                    phone: phone,
                    walletNumber: document.getElementById('walletNumber').value,
                    password: password,
                    idImageName: idFile.name,
                    avatar: null
                };
                users.push(user);
                localStorage.setItem('dabirha_users', JSON.stringify(users));
                // تسجيل دخول تلقائي
                sessionStorage.setItem('dabirha_session', JSON.stringify({ email: user.email }));
                alert('تم إنشاء حسابك بنجاح!');
                window.location.href = 'index.html';
            };
            reader.readAsDataURL(idFile);
        });
    </script>
</body>
</html>
